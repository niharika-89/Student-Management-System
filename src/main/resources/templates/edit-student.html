
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">SMS</div>
            <div>
                <h5>Student Portal</h5>
                <small>Management System</small>
            </div>
        </div>

        <div class="sidebar-menu">
            <p class="menu-heading">MAIN MENU</p>
            <a th:href="@{/dashboard}" class="menu-link">
                Dashboard
            </a>
            <a th:href="@{/students}" class="menu-link active">
                Students
            </a>
            <a th:href="@{/courses}" class="menu-link">Courses</a>
            <a th:href="@{/attendance}" class="menu-link">Attendance</a>
            <a th:href="@{/marks}" class="menu-link">Marks</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h4>Edit Student</h4>
                <p>Update student information.</p>
            </div>
            <div class="admin-profile">
                <div class="admin-avatar">A</div>
                <div>
                    <strong>Administrator</strong>
                    <small>Admin Account</small>
                </div>
            </div>
        </header>

        <section class="dashboard-content">

            <div class="content-card">

                <h5 class="mb-4">Update Student Details</h5>

                <form th:action="@{/students/update/{id}(id=${student.id})}"
                      th:object="${student}" method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{name}"
                                   class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="tel" th:field="*{phone}"
                                   class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select th:field="*{gender}" class="form-select">
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}"
                                   class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Course</label>
                            <select th:field="*{course.id}" class="form-select">
                                <option value="">Select course</option>
                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.courseName}">
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea th:field="*{address}"
                                      class="form-control" rows="3"></textarea>
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            Update Student
                        </button>
                        <a th:href="@{/students}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>

                </form>
            </div>

        </section>
    </main>
</div>

</body>
</html>
